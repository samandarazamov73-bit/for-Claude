<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------------------------------------------------------------- constants
const G = 9.81;                       // Earth gravity, m/s²
const MODEL_FILES = ['lego_minifigure_rigged.glb', 'lego_minifig_model_rigged.glb'];
const CHAR_H = 1.8;                   // character height, m
const MODEL_YAW = 0;                  // model faces +Z
const CRUISE = 18, BOOST = 55;        // horizontal flight speeds, m/s
const CLIMB = 8;                      // E/Q vertical speed, m/s
const WALK = 4.5, RUN = 8;
const LIFT_MAX = 3 * G;               // max lift acceleration
const LAND_ZONE = 2;                  // m
const HOVER_AMP = 0.15, HOVER_PERIOD = 2.8;
const MIN_HOLD = 0.5;
const THRUST = 10, BOOST_THRUST = 12;       // forward thrust, m/s² (cruise / extra at full boost)
const TURN_ACC = 45, BOOST_TURN_ACC = 15;   // lateral (turning) acceleration, m/s²
const BRAKE_ACC = 12, BRAKE_DRAG = 0.006;   // braking on release: 12 + 0.006·v² m/s²
const HARD_BRAKE = 40;                      // C key
const OVERSPEED_ACC = 4, AIR_DRAG = 0.004;  // drag when faster than target speed (after dash / boost)
const DASH_TIME = 0.24, DASH_DV = 28, DASH_ACC = 200, DASH_MAX = 90, DASH_CD = 0.85;
const DODGE_TIME = 0.18, DODGE_ACC = 110, DODGE_CD = 0.4;
const LAUNCH_TIME = 0.35, LAUNCH_ACC = 26;  // takeoff impulse: net upward accel, m/s²
const VBOOST_ACC = 30, VBOOST_VMAX = 35;    // Shift+E: net upward accel (m/s²) and top climb speed (m/s)
const FOV_BASE = 70, FOV_FAST = 18;         // dynamic FOV: 70° in normal flight → ~88° at 55–60 m/s
const START = new THREE.Vector3(0, 0, 180); // route start pad
const WORLD_HALF = 245;
const DEG = Math.PI / 180;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth01 = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xd2e7f6);
scene.fog = new THREE.Fog(HORIZON, 180, 650);
const camera = new THREE.PerspectiveCamera(FOV_BASE, innerWidth / innerHeight, 0.1, 2500);

const sky = new THREE.Mesh(new THREE.SphereGeometry(1200, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x2a64b0) }, bottom: { value: HORIZON } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(vP.y, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h, 0.55)), 1.0); \n#include <colorspace_fragment>\n }'
}));
sky.frustumCulled = false;
sky.renderOrder = -1;
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xd6eaff, 0x55604c, 0.7));
const SUN_DIR = new THREE.Vector3(0.45, 0.8, 0.35).normalize();
const sun = new THREE.DirectionalLight(0xfff2df, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 600 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// ground: one 50 m tile = 5×10 m cells, repeated
const gridTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#7f8c76'; x.fillRect(0, 0, 512, 512);
  x.fillStyle = '#6b7863';
  for (let i = 0; i < 5; i++) { x.fillRect(i * 102.4 - 1, 0, 2, 512); x.fillRect(0, i * 102.4 - 1, 512, 2); }
  x.fillStyle = '#56624f'; x.fillRect(0, 0, 512, 3); x.fillRect(0, 0, 3, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ map: gridTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// landmarks: [x, z, height, type]
const LANDMARKS = [
  [25, -35, 5, 'box'], [-40, -60, 10, 'cyl'], [60, -90, 20, 'box'], [-90, -20, 15, 'box'],
  [100, 10, 30, 'cyl'], [-20, 70, 8, 'cyl'], [45, 120, 25, 'box'], [-130, 90, 12, 'box'],
  [150, -150, 18, 'cyl'], [-170, -140, 28, 'box'], [190, 160, 22, 'box'], [-60, -180, 6, 'cyl'],
  [-45, -125, 14, 'box'], [-200, 30, 30, 'cyl']
];
const LM_COLORS = [0xb9b2a4, 0x9aa7b4, 0xc2a88b, 0xa3a38f, 0xb7c0c7];
LANDMARKS.forEach(([x, z, h, t], i) => {
  const geo = t === 'box' ? new THREE.BoxGeometry(5, h, 5) : new THREE.CylinderGeometry(2.5, 2.5, h, 20);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: LM_COLORS[i % LM_COLORS.length], roughness: 0.9 }));
  m.position.set(x, h / 2, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
});

// ---------------------------------------------------------------- test route: rings, gates, pillars
// Start pad → takeoff → Vertical Boost through a flat ring (coast up to ~60 m) → rings at 60 / 40 / 25 / 10 m → Boost corridor →
// sharp right turn → Dash between two gates → Dodge slalom → stop in the brake zone → land on the pad.
const COURSE = [
  { kind: 'ring', label: 'VERTICAL BOOST · 25 m', c: [0, 25, 150], n: 'y', R: 7 },
  { kind: 'ring', label: 'RING · 60 m', c: [0, 60, 75], n: 'z', R: 7 },
  { kind: 'ring', label: 'RING · 40 m', c: [0, 40, 15], n: 'z', R: 7 },
  { kind: 'ring', label: 'RING · 25 m', c: [0, 25, -35], n: 'z', R: 7 },
  { kind: 'ring', label: 'RING · 10 m', c: [0, 10, -75], n: 'z', R: 6 },
  { kind: 'gate', label: 'BOOST', c: [0, 0, -100], n: 'z', W: 18, H: 30 },
  { kind: 'gate', label: 'TURN', c: [70, 0, -212], n: 'x', W: 16, H: 30 },
  { kind: 'gate', label: 'DASH', c: [100, 0, -212], n: 'x', W: 14, H: 26 },
  { kind: 'gate', label: '', c: [140, 0, -212], n: 'x', W: 14, H: 26 },
  { kind: 'gate', label: 'DODGE', c: [165, 0, -206], n: 'x', W: 8, H: 24 },
  { kind: 'gate', label: '', c: [183, 0, -218], n: 'x', W: 8, H: 24 },
  { kind: 'gate', label: '', c: [201, 0, -206], n: 'x', W: 8, H: 24 },
  { kind: 'zone', label: 'BRAKE · stop here', min: [212, 0, -234], max: [242, 60, -190] },
  { kind: 'pad', label: 'LAND', c: [222, 0, -160], R: 7 },
];
const PILLARS = [];   // { x, z, r, h, mat } — hits are counted, physics is not affected
const BARS = [];      // crossbars: { box: Box3, mat }
const COL = { idle: 0xffa21f, next: 0x7fe3ff, done: 0x4bd27a, post: 0xe4e8ee, hit: 0xff3b30 };
const labelSprite = (text, w = 14) => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 112;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(10,20,35,0.72)';
  if (x.roundRect) { x.beginPath(); x.roundRect(4, 4, 504, 104, 22); x.fill(); } else x.fillRect(4, 4, 504, 104);
  x.fillStyle = '#ffffff'; x.font = 'bold 52px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 256, 58);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(w, w * 112 / 512, 1);
  return s;
};
const addPillar = (x, z, r, h, color = COL.post) => {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), mat);
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  PILLARS.push({ x, z, r, h, mat, base: color, hitT: 0 });
};
for (const cp of COURSE) {
  const [cx, cy, cz] = cp.c || [0, 0, 0];
  cp.mats = [];
  if (cp.kind === 'ring') {
    const mat = new THREE.MeshStandardMaterial({ color: COL.idle, emissive: COL.idle, emissiveIntensity: 0.25, roughness: 0.4 });
    const m = new THREE.Mesh(new THREE.TorusGeometry(cp.R, 0.45, 12, 56), mat);
    m.position.set(cx, cy, cz);
    if (cp.n === 'y') m.rotation.x = Math.PI / 2;
    if (cp.n === 'x') m.rotation.y = Math.PI / 2;
    scene.add(m); cp.mats.push(mat);
    if (cp.label) { const l = labelSprite(cp.label); l.position.set(cx, cy + cp.R + 3, cz); scene.add(l); }
  } else if (cp.kind === 'gate') {
    const lat = cp.n === 'z' ? [1, 0] : [0, 1];        // lateral axis (x for z-gates, z for x-gates)
    for (const sgn of [-1, 1]) addPillar(cx + lat[0] * sgn * cp.W / 2, cz + lat[1] * sgn * cp.W / 2, 0.8, cp.H + 0.6);
    const mat = new THREE.MeshStandardMaterial({ color: COL.idle, emissive: COL.idle, emissiveIntensity: 0.25, roughness: 0.5 });
    const bw = cp.W + 1.6;
    const bar = new THREE.Mesh(new THREE.BoxGeometry(lat[0] ? bw : 1.2, 1.2, lat[1] ? bw : 1.2), mat);
    bar.position.set(cx, cp.H, cz); bar.castShadow = true; scene.add(bar);
    BARS.push({ box: new THREE.Box3().setFromObject(bar).expandByScalar(0.4), mat: null });
    cp.mats.push(mat);
    if (cp.label) { const l = labelSprite(cp.label); l.position.set(cx, cp.H + 4, cz); scene.add(l); }
  } else if (cp.kind === 'zone') {
    const box = new THREE.Box3(new THREE.Vector3(...cp.min), new THREE.Vector3(...cp.max));
    cp.box = box;
    const mat = new THREE.LineBasicMaterial({ color: COL.idle });
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(...box.getSize(new THREE.Vector3()).toArray())), mat);
    box.getCenter(e.position); scene.add(e); cp.mats.push(mat);
    const l = labelSprite(cp.label, 18); l.position.set(e.position.x, cp.max[1] * 0.35, e.position.z); scene.add(l);
  } else if (cp.kind === 'pad') {
    const mat = new THREE.MeshStandardMaterial({ color: COL.idle, emissive: COL.idle, emissiveIntensity: 0.2, roughness: 0.8 });
    const m = new THREE.Mesh(new THREE.CylinderGeometry(cp.R, cp.R, 0.06, 40), mat);
    m.position.set(cx, 0.03, cz); m.receiveShadow = true; scene.add(m); cp.mats.push(mat);
    const l = labelSprite(cp.label, 10); l.position.set(cx + cp.R + 4, 3.5, cz); scene.add(l);
  }
}
// boost corridor (narrow passage) and the corner post of the sharp turn
for (const z of [-120, -140, -160]) { addPillar(-9, z, 1.2, 45); addPillar(9, z, 1.2, 45); }
addPillar(-14, -224, 1.8, 70, 0xd8483a);
{ // start pad
  const m = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 0.06, 40), new THREE.MeshStandardMaterial({ color: 0x3b7bd6, roughness: 0.8 }));
  m.position.set(START.x, 0.03, START.z); m.receiveShadow = true; scene.add(m);
  const l = labelSprite('START', 10); l.position.set(START.x + 10, 3.5, START.z); scene.add(l);
}
const course = { idx: 0, hits: 0, t0: null, time: 0, done: false };
function setCourseColors(t) {
  COURSE.forEach((cp, i) => {
    const col = i < course.idx ? COL.done : i === course.idx ? COL.next : COL.idle;
    const glow = i === course.idx ? 0.5 + 0.5 * Math.sin(t * 5) : 0.25;
    for (const m of cp.mats) { m.color.setHex(col); if (m.emissive) { m.emissive.setHex(col); m.emissiveIntensity = glow; } }
  });
}

// ---------------------------------------------------------------- character
const player = new THREE.Group();          // position = feet, rotation.y = heading
const tilt = new THREE.Group();            // pitch / roll around body center
tilt.position.y = CHAR_H / 2;
tilt.rotation.order = 'ZXY';
const body = new THREE.Group();
body.position.y = -CHAR_H / 2;
tilt.add(body); player.add(tilt); scene.add(player);

let modelRoot = null;
const rig = {};                            // posed bones: head / armL / armR / legL / legR

// glow texture + effects
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(200,235,255,.6)'); g.addColorStop(1, 'rgba(150,210,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const makeGlow = () => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xaee0ff, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending }));
  s.renderOrder = 2; body.add(s); return s;
};
const footGlow = makeGlow(); footGlow.position.set(0, 0.05, 0);
const handGlows = [makeGlow(), makeGlow()];
handGlows[0].position.set(0.38, 0.85, 0.1); handGlows[1].position.set(-0.38, 0.85, 0.1);

const cone = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.4, 20, 1, true), new THREE.MeshBasicMaterial({
  color: 0xbfe8ff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
cone.position.y = -0.7; // apex at feet, opening downward
const coneHolder = new THREE.Group(); coneHolder.add(cone); body.add(coneHolder);
const shock = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 48), new THREE.MeshBasicMaterial({
  color: 0xcfeeff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
shock.rotation.x = -Math.PI / 2; shock.visible = false; scene.add(shock);

// particles (takeoff burst, air brake, checkpoint sparkle, tiny jet sparks); size is per particle (1 = 0.55)
const PN = 800;
const pPos = new Float32Array(PN * 3), pCol = new Float32Array(PN * 3), pVel = new Float32Array(PN * 3);
const pLife = new Float32Array(PN), pMax = new Float32Array(PN), pInt = new Float32Array(PN), pSize = new Float32Array(PN).fill(1);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('pSize', new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.55, map: glowTex, vertexColors: true,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
particles.material.onBeforeCompile = s => {
  s.vertexShader = 'attribute float pSize;\n' + s.vertexShader.replace('gl_PointSize = size;', 'gl_PointSize = size * pSize;');
};
particles.frustumCulled = false;
scene.add(particles);
let pNext = 0;
function emit(p, vx, vy, vz, life, intensity = 1, size = 1) {
  const i = pNext; pNext = (pNext + 1) % PN;
  pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = p.z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  pLife[i] = pMax[i] = life; pInt[i] = intensity;
  if (pSize[i] !== size) { pSize[i] = size; pGeo.attributes.pSize.needsUpdate = true; }
}
function updateParticles(dt) {
  for (let i = 0; i < PN; i++) {
    if (pLife[i] <= 0) { pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = 0; continue; }
    pLife[i] -= dt;
    const k = Math.max(0, pLife[i] / pMax[i]) * pInt[i];
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    pCol[i * 3] = 0.65 * k; pCol[i * 3 + 1] = 0.85 * k; pCol[i * 3 + 2] = 1.0 * k;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

// ---------------------------------------------------------------- energy jets (flight trail)
// Each jet is one camera-facing ribbon (a single dynamic BufferGeometry): white core + blue glow across its width,
// fading toward the tail. Samples are dropped in world space at the nozzle every frame and keep part of the character's
// velocity, so after a sharp turn the older part keeps drifting the old way and bends instead of swinging with the body.
const TRAIL_N = 128;                            // samples per jet (ring buffer)
const TRAIL_INHERIT = 0.4, TRAIL_DRAG = 2.5;    // share of the character's velocity a sample keeps, and its decay (1/s)
const trailMat = new THREE.ShaderMaterial({
  uniforms: { core: { value: new THREE.Vector3(0.96, 0.99, 1) }, glow: { value: new THREE.Vector3(0.2, 0.56, 1) } },

  // bones

    color: 0xcfe9ff, transparent: true, opacity: 0.25, roughness: 0.05, metalness: 0.1, depthWrite: false }));

    p += (-12 - p) * Math.min(1, st.launchFx * 1.5);                       // takeoff: lean back / up
    p += (-14 - p) * Math.min(1, st.vboostFx * 1.5);                       // vertical boost: lean back
    pitchT = clamp(p, -20, 30) * DEG;
    // bank into the lateral acceleration (turns, dodges), plus a roll kick on dodge
    rollT = clamp(Math.atan2(st.aLat, G) * 0.45, -30 * DEG, 30 * DEG) * Math.min(1, hs / 6);
    rollT += st.dodgeSide * 22 * DEG * Math.sin(Math.PI * (1 - st.dodgeFx)) * (st.dodgeFx > 0 ? 1 : 0);
  } else if (st.grounded) {
    pitchT = 6 * DEG * Math.min(1, hs / RUN);
  } else {                                                                 // falling: slow, loose tumble
    pitchT = 7 * DEG * Math.sin(st.simT * 0.9);
    rollT = 6 * DEG * Math.sin(st.simT * 0.7 + 1);
  }
  st.pitch += (pitchT - st.pitch) * damp(5, dt);
  st.roll += (rollT - st.roll) * damp(6, dt);
  tilt.rotation.set(st.pitch, 0, st.roll);
  updatePose(dt, hs, sfast, inp.mag > 0.05);

  // glows
  const fast = clamp((speed - 30) / 25, 0, 1);
  const glowT = st.flying ? 0.25 + 0.75 * fast + clamp((st.lift - G) / (2 * G), 0, 0.4) : st.spool > 0 ? 0.6 : 0;
  st.glow += (glowT - st.glow) * damp(5, dt);
  st.pulse = Math.min(1, st.pulse + dt / 0.6);
  st.landPulse = Math.min(1, st.landPulse + dt / 0.5);
  // dash / dodge / vertical boost light up the glows but no longer inflate them: the energy jet ribbon carries those effects
  const pulseFlash = (1 - st.pulse) * (1 - st.pulse), jetFlash = Math.max(st.dashFx * 0.8, st.dodgeFx * 0.4, st.vboostFx * 0.7);
  const flash = Math.max(pulseFlash, jetFlash);
  footGlow.material.opacity = clamp(st.glow + flash, 0, 1);
  footGlow.scale.setScalar(0.5 + st.glow * 0.6 + pulseFlash * 1.5 + jetFlash * 0.3);
  for (const hg of handGlows) {
    hg.material.opacity = clamp(st.glow * 0.8 + flash, 0, 1);
    hg.scale.setScalar(0.25 + st.glow * 0.5 + pulseFlash * 0.9 + jetFlash * 0.25);
  }
  const cp = Math.max(1 - st.pulse, (1 - st.landPulse) * 0.6);
  cone.material.opacity = 0.85 * cp;
  coneHolder.scale.set(1 + (1 - cp) * 1.6, 0.6 + (1 - cp) * 1.2, 1 + (1 - cp) * 1.6);
  coneHolder.visible = cp > 0.01;
  st.shockT += dt;
  shock.visible = st.shockT < 0.6;
  if (shock.visible) { const t = st.shockT / 0.6; shock.scale.setScalar(1 + 7 * t); shock.material.opacity = 0.8 * (1 - t); }

  // particles: braking air (the flight / dash / dodge / vertical-boost trail is the energy jet ribbon, see updateTrails)
  const spawn = (rate, fn) => { const n = Math.floor(rate * dt + Math.random()); for (let i = 0; i < n; i++) fn(); };
  tilt.getWorldPosition(_cp);
  const rnd = a => (Math.random() - 0.5) * a;
  const braking = st.flying && st.action === 'BRAKE' && hs > 12;
  if (braking && !st.braking && hs > 18) {                                   // air-brake ring (fine sparks), keeps flying forward
    const ux = vel.x / hs, uz = vel.z / hs;
    for (let i = 0; i < 28; i++) {
      const a = i / 28 * Math.PI * 2, rx = -uz * Math.cos(a), rz = ux * Math.cos(a), ry = Math.sin(a);
      emit(_tmp.set(_cp.x + ux * 0.8 + rx * 0.6, _cp.y + ry * 0.6, _cp.z + uz * 0.8 + rz * 0.6), vel.x * 0.9 + rx * 5, vel.y + ry * 5, vel.z * 0.9 + rz * 5, 0.5, 1, 0.3);
    }
  }
  st.braking = braking;
  if (braking && st.aFwd < -8) spawn(140 * clamp((-st.aFwd - 8) / 30, 0.2, 1), () =>
    emit(_tmp.set(_cp.x + vel.x / hs * 0.8 + rnd(0.8), _cp.y + rnd(0.9), _cp.z + vel.z / hs * 0.8 + rnd(0.8)), vel.x + rnd(2), vel.y + rnd(2), vel.z + rnd(2), 0.45, 0.8, 0.3));
  updateParticles(dt);
  updateCourse(dt);

  // camera: locked to player translation + smoothed offset; lags on acceleration and catches up; auto-follows when mouse is idle
  if (st.flying && hs > 8 && lookIdle > 0.8 && st.dashT <= 0) {
    const d = wrapAngle(Math.atan2(vel.x, vel.z) + Math.PI - camYaw);
    if (Math.abs(d) < 2.2) camYaw += d * damp(1.6, dt);
  }
  const sp = clamp((speed - 15) / 40, 0, 1);
  camDist += (6 + sp * 3 + st.vboostFx * 2.5 + st.dashFx * 0.8 - camDist) * damp(2, dt);
  // dynamic FOV: ~70° normal flight, ~78° at 35 m/s, ~88° at 55–60 m/s, + short kick on dash / vertical boost
  const fovT = FOV_BASE + FOV_FAST * smooth01(18, 58, speed) + st.dashFx * 6 + st.vboostFx * 5;
  fov += (fovT - fov) * damp(2.5, dt);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  _lagT.copy(st.acc).multiplyScalar(-0.03);
  if (_lagT.length() > 3) _lagT.setLength(3);
  _lagT.addScaledVector(vel, -0.02);
  lag.lerp(_lagT, damp(3, dt));
  _camOff.set(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch)).multiplyScalar(camDist);
  camera.position.copy(pos).add(_camOff).add(lag);
  camera.position.y += 1.5;
  camera.position.y = Math.max(camera.position.y, 0.3);
  camera.lookAt(pos.x, pos.y + 1.3, pos.z);
  st.camRoll += ((st.flying ? st.roll * 0.22 : 0) - st.camRoll) * damp(4, dt);   // light bank with the character on turns / dodges
  camera.rotateZ(-st.camRoll);
  sky.position.copy(camera.position);
  updateTrails(dt, hs);                                         // after the camera: ribbons are built facing it

  // sun / shadow follow player's shadow point
  const shp = _tmp.copy(pos).addScaledVector(SUN_DIR, -pos.y / SUN_DIR.y);
  sun.target.position.copy(shp);
  sun.position.copy(shp).addScaledVector(SUN_DIR, 300);
}

// ---------------------------------------------------------------- HUD
const hud = document.getElementById('hud');
let fpsFrames = 0, fpsTime = 0, fps = 0, hudTime = 0;
function updateHud(dt, rawDt) {
  fpsFrames++; fpsTime += rawDt;
  if (fpsTime >= 0.5) { fps = Math.round(fpsFrames / fpsTime); fpsFrames = 0; fpsTime = 0; }
  hudTime += dt;
  if (hudTime < 0.1) return;
  hudTime = 0;
  const mode = st.grounded ? 'Ground' : st.flying ? (st.hovering ? 'Hover' : 'Flight') : 'Fall';
  const route = course.done
    ? `Route complete: ${course.time.toFixed(1)} s · hits ${course.hits} · R — restart`
    : `Route ${course.idx}/${COURSE.length} → ${CP_NAMES[course.idx]} · hits ${course.hits}${course.t0 !== null ? ' · ' + course.time.toFixed(1) + ' s' : ''}`;
  hud.innerHTML =
    `Speed: ${vel.length().toFixed(1)} m/s\nAltitude: ${Math.max(0, pos.y).toFixed(1)} m\nMode: ${mode}\nFPS: ${fps}` +
    `\nVertical Speed: ${vel.y.toFixed(1)} m/s\nBoost: ${st.vboost ? 'ON (vertical)' : st.boostOn ? 'ON' : 'OFF'}\nDash: ${st.dashCd > 0 ? 'COOLDOWN ' + st.dashCd.toFixed(1) + 's' : 'READY'}` +
    `\n<span class="dim">Lift: ${(st.lift / G).toFixed(2)} g · g = ${G} m/s² · FOV ${fov.toFixed(0)}°${st.action ? ' · ' + st.action : ''}<br>${route}</span>`;
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let paused = false;
function frame() {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05);
  if (paused) { renderer.render(scene, camera); return; }
  const inp = readInput(dt);
  if (inp.dodge) requestDodge(inp.dodge);
  if (dashQueued) { dashQueued = false; requestDash(inp); }
  const n = Math.max(1, Math.ceil(dt / (1 / 120)));
  for (let i = 0; i < n; i++) physicsStep(dt / n, inp);
  updateVisuals(dt, inp);
  updateHud(dt, rawDt);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// debug hook (console)
window.flightDebug = {
  st, pos, vel, rig, pose, G, step: physicsStep, visuals: updateVisuals, toggleFlight, requestDash, requestDodge,
  pause: v => { paused = v; }, setCam: (yaw, pitch) => { camYaw = yaw; camPitch = pitch; lookIdle = -1e9; },
  restartRoute, course, COURSE, PILLARS, camera,
  model: window.flightDebug && window.flightDebug.model
};
</script>

</body></html>
