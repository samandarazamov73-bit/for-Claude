<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SPIDER SWING</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238a0f24'/%3E%3Cpath d='M16 6 16 26M6 16 26 16M9 9 23 23M23 9 9 23' stroke='%2312060a' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- HUD (in-game) -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div class="hud-row">Distance: <span id="hud-distance">0</span> m</div>
      <div class="hud-row hud-sub">Best: <span id="hud-best">0</span> m</div>
    </div>
    <div id="hud-right">
      <div id="hud-combo" class="hidden">COMBO x<span id="hud-combo-value">1</span></div>
    </div>
    <button id="btn-pause" aria-label="Pause">❚❚</button>
    <button id="btn-mute" aria-label="Mute">🔊</button>
  </div>

  <div id="hint" class="hidden">
    <span class="hint-desktop">HOLD SPACE / CLICK TO SWING</span>
    <span class="hint-mobile">HOLD TO SWING</span>
    <br>RELEASE TO FLY
  </div>

  <!-- Start Menu -->
  <div id="menu-screen" class="overlay">
    <div class="overlay-panel">
      <h1 class="title">SPIDER SWING</h1>
      <p class="subtitle">Раскачивайся. Отпускай. Лети.</p>
      <button id="btn-play" class="btn-primary">PLAY</button>
      <p class="best-line">BEST: <span id="menu-best">0</span> m</p>
    </div>
  </div>

  <!-- Pause Screen -->
  <div id="pause-screen" class="overlay hidden">
    <div class="overlay-panel">
      <h2 class="title-small">PAUSED</h2>
      <button id="btn-resume" class="btn-primary">RESUME</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="overlay hidden">
    <div class="overlay-panel pop-in">
      <h2 class="title-small">GAME OVER</h2>
      <p class="stat-line">Distance: <span id="final-distance">0</span> m</p>
      <p class="stat-line">Best: <span id="final-best">0</span> m</p>
      <button id="btn-restart" class="btn-primary">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
